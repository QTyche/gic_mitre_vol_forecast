  project_root: ../..
  output_root: results/qbraid/capacity
  sequence_seed: 2026
  sequence_length: 120
  washout: 20
  train_fraction: 0.6
  max_delay: 3
  ridge_alpha: 1.0e-6
  autocorrelation_max_lag: 3
  contractivity_steps: 30
  cross_delay_pairs:
    - [1, 2]
