  n_qubits: 3
  graph: ring
  virtual_nodes: 1
  j_strength: 1.0
  h_strength: 1.0
  tau: 1.0
  input_scaling: 0.5
  state_policy: carry_inputs
  reservoir_seed: 2026
  backend: numpy_density_matrix_exact
ablation:
  input_scaling: [0.5]
  j_strength: [1.0]
