schema_version: 1
experiment:
  name: public_market_logistic_regression
  project_root: ../../..
  seed: 2026
  output_root: results/public_market
data:
  processed_dir: data/processed/public_market
  manifest: data/processed/public_market/data_manifest.json
model:
  type: logistic_regression
  task: regime_classification
  parameters:
    regularization_c: 1.0
    class_weight: null
    max_iterations: 1000
search:
  enabled: true
  selection_metric: macro_f1
  maximum_trials: 3
  space:
    regularization_c: [0.1, 1.0, 10.0]
evaluation:
  transition_threshold: 0.5
  variance_floor: 1.0e-12
