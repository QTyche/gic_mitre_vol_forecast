schema_version: 1
experiment:
  name: public_market_esn_classifier_search
  project_root: ../../..
  seed: 2026
  output_root: results/public_market
data:
  processed_dir: data/processed/public_market
  manifest: data/processed/public_market/data_manifest.json
model:
  type: esn_classifier
  task: regime_classification
  parameters:
    reservoir_size: 50
    spectral_radius: 0.9
    input_scaling: 0.5
    leaking_rate: 0.4
    sparsity: 0.1
    washout: 20
    ridge_alpha: 0.001
    state_policy: carry_inputs
search:
  enabled: true
  selection_metric: macro_f1
  maximum_trials: 20
  space:
    reservoir_size: [25, 50, 100]
    spectral_radius: [0.6, 0.9, 1.1]
    leaking_rate: [0.1, 0.4, 0.8]
    input_scaling: [0.1, 0.5, 1.0]
    sparsity: [0.05, 0.1, 0.2]
    ridge_alpha: [1.0e-5, 0.001, 0.1]
evaluation:
  transition_threshold: 0.5
  variance_floor: 1.0e-12
