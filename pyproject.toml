[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qtyche-qrc"
version = "0.1.0"
description = "Reproducible experiments for volatility-regime forecasting with quantum reservoir computing."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Team QTyche" }]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pandas-stubs>=2.0,<3",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
qtyche-qrc = "qtyche_qrc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not network'"
testpaths = ["tests"]
markers = [
  "network: live provider integration tests excluded from the default offline suite",
]

[tool.ruff]
extend-exclude = [".uv-cache", ".venv"]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["qtyche_qrc"]
mypy_path = "src"
